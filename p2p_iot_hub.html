<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal P2P & IoT Hub</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 15px; max-width: 780px; margin: auto; }
        .card { background: #1e1e1e; padding: 18px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #2c2c2c; }
        input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; box-sizing: border-box; font-size: 15px; }
        input[type="text"] { background: #2c2c2c; color: #fff; }
        button { background: #007bff; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #444; cursor: not-allowed; }
        .row-flex { display: flex; gap: 8px; margin-top: 8px; }
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
        .btn-green { background: #00b894; }
        .btn-purple { background: #6c5ce7; }
        .btn-orange { background: #e17055; }
        .btn-gray { background: #4b5563; }
        .btn-red { background: #d63031; }
        #chatBox { height: 220px; overflow-y: auto; background: #141414; padding: 10px; border-radius: 8px; border: 1px solid #333; margin-top: 10px; }
        .msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 6px; background: #252525; word-wrap: break-word; font-size: 14px; }
        .sys { color: #888; font-style: italic; }
        .p2p { border-left: 4px solid #00e676; }
        .mqtt { border-left: 4px solid #ff9100; }
        #videoGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 10px; }
        video, #iotCamView { width: 100%; border-radius: 8px; background: #000; border: 1px solid #444; }
        a.dl-link { color: #00e676; font-weight: bold; text-decoration: underline; display: inline-block; margin-top: 5px; }
        .iot-panel { background: #252525; padding: 12px; border-radius: 8px; margin-top: 12px; border: 1px solid #3a3a3a; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="margin-top:0;">📡 Universal P2P & IoT Hub</h2>
        <p class="sys" style="margin-top:-8px;">เลือกช่องทางของคุณเอง หรือใช้ลิงก์ห้องเพื่อเชื่อมต่อกับอุปกรณ์และเพื่อนแบบไร้ขีดจำกัด</p>
        <div class="row-flex">
            <input type="text" id="channelInput" placeholder="ชื่อช่องสัญญาณของคุณ..." style="margin-top:0;">
            <button class="btn-gray" onclick="generateRandomRoom()" style="width: auto; white-space: nowrap; margin-top:0;">🎲 สุ่มใหม่</button>
        </div>
        <div class="btn-grid">
            <button id="joinBtn" onclick="joinChannel()">เข้าสู่ช่องสัญญาณ</button>
            <button class="btn-purple" onclick="copyRoomLink()">🔗 คัดลอกลิงก์ห้อง</button>
        </div>
        <p id="status" class="sys" style="margin-bottom:0; margin-top:10px;">สถานะ: ยังไม่ได้เชื่อมต่อ</p>
    </div>

    <div class="card" id="commPanel" style="display:none;">
        <!-- พื้นที่แสดงวิดีโอ P2P -->
        <div id="videoGrid"></div>

        <!-- ปุ่มควบคุมกล้อง/หน้าจอ P2P -->
        <div class="btn-grid">
            <button id="camBtn" class="btn-green" onclick="toggleMedia('camera')">📷 เปิดกล้อง / ไมค์</button>
            <button id="scrBtn" class="btn-purple" onclick="toggleMedia('screen')">🖥️ แชร์หน้าจอ</button>
        </div>

        <!-- แผงควบคุม IoT และกล้อง ESP32-CAM -->
        <div class="iot-panel">
            <div style="font-size: 14px; font-weight: bold; color: #ff9100; margin-bottom: 6px;">🤖 แผงควบคุมบอร์ด IoT & ESP32-CAM</div>
            <img id="iotCamView" style="display:none; margin-bottom:8px;" alt="ESP32-CAM Stream">
            <div class="btn-grid">
                <button class="btn-gray" onclick="sendIoTCmd('SNAP')">📸 ขอภาพนิ่ง</button>
                <button class="btn-green" onclick="sendIoTCmd('STREAM_ON')">▶️ ภาพสด CAM</button>
                <button class="btn-red" onclick="sendIoTCmd('STREAM_OFF')">⏹️ หยุดภาพสด</button>
                <button class="btn-orange" onclick="sendIoTCmd('FLASH_ON')">🔦 เปิดแฟลช</button>
                <button class="btn-gray" onclick="sendIoTCmd('FLASH_OFF')">🌑 ปิดแฟลช</button>
                <button class="btn-green" onclick="sendIoTCmd('ON')">💡 เปิดไฟ (ON)</button>
                <button class="btn-red" onclick="sendIoTCmd('OFF')">🔌 ปิดไฟ (OFF)</button>
            </div>
        </div>

        <!-- ระบบส่งไฟล์ขนาดใหญ่ -->
        <div class="iot-panel">
            <label style="font-size: 14px; color: #bbb;">📁 ส่งไฟล์ตรง P2P (ไม่จำกัดขนาด):</label>
            <input type="file" id="fileInput" style="background: transparent; padding: 5px 0;">
            <button class="btn-orange" onclick="sendLargeFile()">ส่งไฟล์ให้ทุกคนในห้อง</button>
            <div id="fileProgress" class="sys" style="margin-top:5px;"></div>
        </div>

        <!-- กล่องข้อความ -->
        <div id="chatBox"></div>
        <div class="row-flex">
            <input type="text" id="msgInput" placeholder="พิมพ์ข้อความ หรือคำสั่งส่งไปในห้อง..." onkeypress="if(event.key==='Enter') sendText()" style="margin-top:0;">
            <button onclick="sendText()" style="width: 100px; margin-top:0;">ส่ง</button>
        </div>
    </div>

    <script>
        let mqttClient, peer, localStream;
        let currentMediaMode = null;
        let connections = {};
        let incomingFiles = {};
        let myPeerId = 'user-' + Math.random().toString(36).substr(2, 7);
        let currentTopic = '';

        const brokers = [
            'wss://broker.emqx.io:8084/mqtt',
            'wss://broker.hivemq.com:8884/mqtt'
        ];
        let brokerIndex = 0;

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const roomParam = params.get('room');
            if (roomParam) {
                document.getElementById('channelInput').value = roomParam;
                joinChannel();
            } else {
                generateRandomRoom();
            }
        };

        function generateRandomRoom() {
            const rand = 'ch-' + Math.random().toString(36).substr(2, 6);
            document.getElementById('channelInput').value = rand;
        }

        function copyRoomLink() {
            const room = document.getElementById('channelInput').value.trim();
            if (!room) return alert('กรุณาใส่ชื่อช่องสัญญาณก่อนครับ');
            const url = new URL(window.location.href);
            url.searchParams.set('room', room);
            navigator.clipboard.writeText(url.toString());
            alert('คัดลอกลิงก์เข้าห้องเรียบร้อยแล้ว! ส่งให้เพื่อนหรือเปิดบนอุปกรณ์อื่นได้ทันที:\n' + url.toString());
        }

        function log(html, type = 'sys') {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.innerHTML = html;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function joinChannel() {
            const channel = document.getElementById('channelInput').value.trim();
            if (!channel) return alert('กรุณาใส่ชื่อช่องสัญญาณ');

            document.getElementById('joinBtn').disabled = true;
            document.getElementById('channelInput').disabled = true;
            document.getElementById('commPanel').style.display = 'block';
            currentTopic = 'universal-p2p-app/' + channel;

            peer = new Peer(myPeerId, {
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun.cloudflare.com:3478' }
                    ]
                }
            });

            peer.on('open', (id) => {
                log(`รหัสเครื่องของคุณ: <b>${id}</b>`);
                connectMQTT();
            });

            peer.on('connection', (conn) => setupDataConn(conn));

            peer.on('call', (call) => {
                call.answer(localStream || null);
                call.on('stream', (remoteStream) => addVideoStream(call.peer, remoteStream));
            });
        }

        function connectMQTT() {
            const brokerUrl = brokers[brokerIndex];
            document.getElementById('status').innerText = `สถานะ: กำลังเชื่อมต่อเซิร์ฟเวอร์ (${brokerIndex + 1}/${brokers.length})...`;
            
            mqttClient = mqtt.connect(brokerUrl, { connectTimeout: 4500, reconnectPeriod: 3000 });

            const fallbackTimer = setTimeout(() => {
                if (!mqttClient.connected) {
                    mqttClient.end(true);
                    brokerIndex = (brokerIndex + 1) % brokers.length;
                    connectMQTT();
                }
            }, 4600);

            mqttClient.on('connect', () => {
                clearTimeout(fallbackTimer);
                document.getElementById('status').innerText = `สถานะ: ออนไลน์ในห้อง [${document.getElementById('channelInput').value}]`;
                mqttClient.subscribe(currentTopic);
                mqttClient.publish(currentTopic, JSON.stringify({ type: 'HELLO', peerId: myPeerId }));
                log('เชื่อมต่อระบบค้นหาสำเร็จ พร้อมรับ-ส่งข้อมูล P2P และ IoT');
            });

            mqttClient.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    if (data.type === 'HELLO' && data.peerId !== myPeerId) {
                        if (!connections[data.peerId]) {
                            const conn = peer.connect(data.peerId, { reliable: true });
                            setupDataConn(conn);
                        }
                        if (localStream) {
                            peer.call(data.peerId, localStream);
                        }
                    } else if (data.type === 'IOT_DATA') {
                        log(`🤖 <b>[IoT]:</b> ${data.payload}`, 'mqtt');
                    } else if (data.type === 'IOT_CAM') {
                        const img = document.getElementById('iotCamView');
                        img.style.display = 'block';
                        img.src = 'data:image/jpeg;base64,' + data.image;
                    }
                } catch (e) {
                    log(`🤖 <b>[IoT Raw]:</b> ${message.toString()}`, 'mqtt');
                }
            });
        }

        function setupDataConn(conn) {
            conn.on('open', () => {
                connections[conn.peer] = conn;
                log(`✅ เชื่อมต่อตรง P2P กับ <b>${conn.peer}</b> สำเร็จ`);
                if (localStream) {
                    peer.call(conn.peer, localStream);
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'CHAT') {
                    log(`💬 <b>[${conn.peer}]:</b> ${data.text}`, 'p2p');
                } else if (data.type === 'FILE_META') {
                    incomingFiles[data.fileId] = { name: data.name, size: data.size, chunks: [], received: 0 };
                    log(`📥 กำลังรับไฟล์: <b>${data.name}</b> (${(data.size / 1048576).toFixed(2)} MB)...`, 'p2p');
                } else if (data.type === 'FILE_CHUNK') {
                    const file = incomingFiles[data.fileId];
                    if (!file) return;
                    file.chunks.push(data.chunk);
                    file.received += data.chunk.byteLength;
                    if (file.received >= file.size) {
                        const blob = new Blob(file.chunks);
                        const url = URL.createObjectURL(blob);
                        log(`✅ รับไฟล์เสร็จสิ้น: <a class="dl-link" href="${url}" download="${file.name}">คลิกเพื่อดาวน์โหลด ${file.name}</a>`, 'p2p');
                        delete incomingFiles[data.fileId];
                    }
                }
            });

            conn.on('close', () => {
                delete connections[conn.peer];
                const vid = document.getElementById('vid-' + conn.peer);
                if (vid) vid.remove();
                log(`❌ <b>${conn.peer}</b> ออกจากห้องแล้ว`);
            });
        }

        function sendText() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            for (let id in connections) {
                connections[id].send({ type: 'CHAT', text: text });
            }
            if (mqttClient && mqttClient.connected) {
                mqttClient.publish(currentTopic, JSON.stringify({ type: 'CMD', payload: text }));
            }
            log(`📤 <b>[ฉัน]:</b> ${text}`, 'p2p');
            input.value = '';
        }

        function sendIoTCmd(cmd) {
            if (mqttClient && mqttClient.connected) {
                mqttClient.publish(currentTopic, JSON.stringify({ type: 'CMD', payload: cmd }));
                log(`📡 ส่งคำสั่ง IoT: <b>${cmd}</b>`, 'mqtt');
                if (cmd === 'STREAM_OFF') {
                    document.getElementById('iotCamView').style.display = 'none';
                }
            }
        }

        async function sendLargeFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return alert('กรุณาเลือกไฟล์ก่อนครับ');
            if (Object.keys(connections).length === 0) return alert('ยังไม่มีเพื่อน P2P อยู่ในห้องครับ');

            const fileId = Math.random().toString(36).substr(2, 9);
            const chunkSize = 65536;
            let offset = 0;

            for (let id in connections) {
                connections[id].send({ type: 'FILE_META', fileId, name: file.name, size: file.size });
            }

            const progressEl = document.getElementById('fileProgress');
            while (offset < file.size) {
                const slice = file.slice(offset, offset + chunkSize);
                const buffer = await slice.arrayBuffer();
                for (let id in connections) {
                    connections[id].send({ type: 'FILE_CHUNK', fileId, chunk: buffer });
                }
                offset += buffer.byteLength;
                const percent = Math.min(100, Math.round((offset / file.size) * 100));
                progressEl.innerText = `กำลังส่งไฟล์ ${file.name}: ${percent}%`;
                await new Promise(r => setTimeout(r, 5));
            }
            log(`📤 ส่งไฟล์ <b>${file.name}</b> สำเร็จ!`, 'p2p');
            progressEl.innerText = '';
            fileInput.value = '';
        }

        async function toggleMedia(mode) {
            if (localStream && currentMediaMode === mode) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
                currentMediaMode = null;
                const vid = document.getElementById('vid-me');
                if (vid) vid.remove();
                document.getElementById('camBtn').innerText = '📷 เปิดกล้อง / ไมค์';
                document.getElementById('scrBtn').innerText = '🖥️ แชร์หน้าจอ';
                return;
            }

            try {
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                }
                if (mode === 'camera') {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('camBtn').innerText = '⏹️ ปิดกล้อง';
                    document.getElementById('scrBtn').innerText = '🖥️ แชร์หน้าจอ';
                } else {
                    localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    document.getElementById('scrBtn').innerText = '⏹️ หยุดแชร์หน้าจอ';
                    document.getElementById('camBtn').innerText = '📷 เปิดกล้อง / ไมค์';
                }
                currentMediaMode = mode;
                addVideoStream('me', localStream, true);

                for (let id in connections) {
                    const call = peer.call(id, localStream);
                    call.on('stream', (remoteStream) => addVideoStream(id, remoteStream));
                }
            } catch (err) {
                alert('ไม่สามารถเข้าถึงกล้องหรือหน้าจอได้: ' + err.message);
            }
        }

        function addVideoStream(id, stream, isMuted = false) {
            let video = document.getElementById('vid-' + id);
            if (!video) {
                video = document.createElement('video');
                video.id = 'vid-' + id;
                video.autoplay = true;
                video.playsInline = true;
                video.muted = isMuted;
                document.getElementById('videoGrid').appendChild(video);
            }
            video.srcObject = stream;
        }
    </script>
</body>
</html>
