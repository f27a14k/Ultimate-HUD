<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Classic Fishing 2026 - 16 Species</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: #041322;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #072038;
    border-bottom: 2px solid #0e3a61;
    font-size: 13px;
    font-weight: bold;
    z-index: 10;
  }
  .stat-pill {
    background: rgba(0, 0, 0, 0.4);
    padding: 4px 10px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .stat-pill span { color: #ffd166; }
  .menu-btns { display: flex; gap: 6px; }
  .mini-btn {
    background: #114b7a;
    color: #fff;
    border: 1px solid #2b7bba;
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .mini-btn:active { transform: scale(0.95); }
  .canvas-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .tension-box {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 78%;
    max-width: 320px;
    background: rgba(4, 19, 34, 0.85);
    border: 2px solid #38bdf8;
    border-radius: 14px;
    padding: 8px 12px;
    display: none;
    z-index: 15;
    text-align: center;
  }
  .tension-title { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #e0f2fe; }
  .bar-bg {
    width: 100%;
    height: 14px;
    background: #1e293b;
    border-radius: 7px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
    transition: width 0.05s linear;
  }
  .prog-bg {
    width: 100%;
    height: 8px;
    background: #0f172a;
    border-radius: 4px;
    margin-top: 6px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    width: 0%;
    background: #38bdf8;
  }
  .toast {
    position: absolute;
    top: 22%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(7, 32, 56, 0.94);
    border: 2px solid #ffd166;
    border-radius: 16px;
    padding: 12px 20px;
    text-align: center;
    font-weight: bold;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s;
    z-index: 25;
    width: 80%;
    max-width: 300px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
  }
  .controls {
    padding: 10px 14px 14px;
    background: #072038;
    border-top: 2px solid #0e3a61;
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  .action-btn {
    flex: 1;
    height: 54px;
    border: none;
    border-radius: 16px;
    font-size: 17px;
    font-weight: bold;
    color: #041322;
    background: linear-gradient(135deg, #ffd166, #f59e0b);
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
    cursor: pointer;
    touch-action: manipulation;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn.reel {
    background: linear-gradient(135deg, #38bdf8, #0284c7);
    color: #fff;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.45);
  }
  .action-btn.bite {
    background: linear-gradient(135deg, #f43f5e, #e11d48);
    color: #fff;
    animation: pulseBtn 0.4s infinite alternate;
  }
  @keyframes pulseBtn { from { transform: scale(1); } to { transform: scale(1.03); } }
  .modal {
    position: absolute;
    inset: 0;
    background: rgba(4, 19, 34, 0.94);
    z-index: 30;
    display: none;
    flex-direction: column;
    padding: 16px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid #1e4976;
    margin-bottom: 10px;
  }
  .close-btn {
    background: #ef4444;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 6px 12px;
    font-weight: bold;
  }
  .dex-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    padding-bottom: 12px;
  }
  .dex-card {
    background: #0a2947;
    border: 1px solid #1d4ed8;
    border-radius: 12px;
    padding: 8px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .dex-card.locked { opacity: 0.45; border-color: #334155; }
  .rarity { font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 6px; align-self: flex-start; }
  .shop-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .shop-item {
    background: #0a2947;
    border: 1px solid #0284c7;
    border-radius: 14px;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .buy-btn {
    background: #22c55e;
    color: #041322;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="stat-pill">💰 <span id="moneyEl">0</span> บ.</div>
  <div class="stat-pill">🐟 สะสม: <span id="dexCountEl">0</span>/16</div>
  <div class="menu-btns">
    <button class="mini-btn" onclick="openDex()">📖 สมุดปลา</button>
    <button class="mini-btn" onclick="openShop()">⚙️ อัปเกรด</button>
  </div>
</div>

<div class="canvas-wrap" id="canvasWrap">
  <canvas id="game"></canvas>

  <div class="tension-box" id="tensionBox">
    <div class="tension-title" id="tensionTitle">กดค้างเพื่อกรอรอก! ระวังสายเอ็นขาด!</div>
    <div class="bar-bg"><div class="bar-fill" id="tensionBar"></div></div>
    <div class="prog-bg"><div class="prog-fill" id="progBar"></div></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal" id="dexModal">
    <div class="modal-header">
      <h3>📖 สมุดสะสมสัตว์น้ำ (16 สายพันธุ์)</h3>
      <button class="close-btn" onclick="closeModals()">ปิด</button>
    </div>
    <div class="dex-grid" id="dexGrid"></div>
  </div>

  <div class="modal" id="shopModal">
    <div class="modal-header">
      <h3>⚙️ ร้านอัปเกรดอุปกรณ์ตกปลา</h3>
      <button class="close-btn" onclick="closeModals()">ปิด</button>
    </div>
    <div class="shop-list" id="shopList"></div>
  </div>
</div>

<div class="controls">
  <button class="action-btn" id="mainBtn">🎣 หย่อนเบ็ด</button>
</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  const mainBtn = document.getElementById('mainBtn');
  const tensionBox = document.getElementById('tensionBox');
  const tensionBar = document.getElementById('tensionBar');
  const progBar = document.getElementById('progBar');
  const toastEl = document.getElementById('toast');

  let W, H, waterY;
  function resize() {
    W = canvas.width = wrap.clientWidth;
    H = canvas.height = wrap.clientHeight;
    waterY = H * 0.24;
  }
  window.addEventListener('resize', resize);
  resize();

  // ระบบเสียงสังเคราะห์ Web Audio API
  let audioCtx = null;
  function playSound(f1, f2, dur, type = 'sine', vol = 0.1) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f1, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(f2, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  // ฐานข้อมูลสัตว์น้ำ 16 สายพันธุ์ แบ่งตามระดับความลึกและความหายาก
  const SPECIES = [
    { id: 0, name: 'ปลาซิวเงิน', rarity: 'Common', rColor: '#94a3b8', zone: [0.05, 0.28], size: 16, speed: 1.5, power: 0.35, price: 15, shape: 'minnow', c1: '#cbd5e1', c2: '#64748b' },
    { id: 1, name: 'ปลาหางนกยูง', rarity: 'Common', rColor: '#94a3b8', zone: [0.06, 0.30], size: 17, speed: 1.3, power: 0.4, price: 20, shape: 'guppy', c1: '#f472b6', c2: '#38bdf8' },
    { id: 2, name: 'ปลาทองอ้วนกลม', rarity: 'Common', rColor: '#94a3b8', zone: [0.10, 0.35], size: 22, speed: 1.0, power: 0.45, price: 30, shape: 'goldfish', c1: '#fb923c', c2: '#fef08a' },
    { id: 3, name: 'ปูเสฉวนก้นบ่อ', rarity: 'Common', rColor: '#94a3b8', zone: [0.88, 0.96], size: 22, speed: 0.6, power: 0.5, price: 35, shape: 'crab', c1: '#ef4444', c2: '#fca5a5' },

    { id: 4, name: 'ปลานิลลายขวาง', rarity: 'Uncommon', rColor: '#22c55e', zone: [0.22, 0.50], size: 26, speed: 1.4, power: 0.65, price: 50, shape: 'normal', c1: '#64748b', c2: '#cbd5e1' },
    { id: 5, name: 'ปลาการ์ตูนส้ม', rarity: 'Uncommon', rColor: '#22c55e', zone: [0.20, 0.48], size: 20, speed: 1.6, power: 0.6, price: 55, shape: 'clown', c1: '#f97316', c2: '#ffffff' },
    { id: 6, name: 'ปลาหมึกกล้วย', rarity: 'Uncommon', rColor: '#22c55e', zone: [0.30, 0.62], size: 25, speed: 1.9, power: 0.75, price: 70, shape: 'squid', c1: '#f43f5e', c2: '#fecdd3' },
    { id: 7, name: 'ปลาปักเป้าพองตัว', rarity: 'Uncommon', rColor: '#22c55e', zone: [0.28, 0.58], size: 26, speed: 1.1, power: 0.8, price: 75, shape: 'puffer', c1: '#eab308', c2: '#fef9c3' },

    { id: 8, name: 'ปลากระเบนปีกกว้าง', rarity: 'Rare', rColor: '#38bdf8', zone: [0.48, 0.78], size: 36, speed: 1.3, power: 1.05, price: 120, shape: 'ray', c1: '#475569', c2: '#94a3b8' },
    { id: 9, name: 'ปลาไหลไฟฟ้า', rarity: 'Rare', rColor: '#38bdf8', zone: [0.50, 0.82], size: 38, speed: 2.1, power: 1.15, price: 140, shape: 'eel', c1: '#06b6d4', c2: '#fef08a' },
    { id: 10, name: 'ปลากระโทงแทง', rarity: 'Rare', rColor: '#38bdf8', zone: [0.45, 0.75], size: 42, speed: 2.6, power: 1.25, price: 165, shape: 'marlin', c1: '#2563eb', c2: '#93c5fd' },
    { id: 11, name: 'เต่าทะเลโบราณ', rarity: 'Rare', rColor: '#38bdf8', zone: [0.40, 0.72], size: 35, speed: 0.9, power: 1.2, price: 180, shape: 'turtle', c1: '#15803d', c2: '#86efac' },

    { id: 12, name: 'ปลาฉลามขาว', rarity: 'Epic', rColor: '#c084fc', zone: [0.68, 0.92], size: 50, speed: 2.3, power: 1.55, price: 280, shape: 'shark', c1: '#475569', c2: '#f8fafc' },
    { id: 13, name: 'วาฬเพชฌฆาต Orca', rarity: 'Epic', rColor: '#c084fc', zone: [0.70, 0.94], size: 56, speed: 2.0, power: 1.75, price: 350, shape: 'orca', c1: '#0f172a', c2: '#ffffff' },

    { id: 14, name: 'หมึกยักษ์คราเคน', rarity: 'Legendary', rColor: '#f59e0b', zone: [0.78, 0.96], size: 58, speed: 1.8, power: 2.05, price: 550, shape: 'kraken', c1: '#9333ea', c2: '#f43f5e' },
    { id: 15, name: 'หีบสมบัติโจรสลัด', rarity: 'Legendary', rColor: '#f59e0b', zone: [0.90, 0.97], size: 30, speed: 0.25, power: 1.9, price: 800, shape: 'chest', c1: '#b45309', c2: '#facc15' }
  ];

  // สถานะผู้เล่น
  let money = 0;
  let lineLv = 1;
  let reelLv = 1;
  let caughtSet = new Set();

  // สถานะสายเบ็ด: 'idle' | 'dropping' | 'waiting' | 'bite' | 'reeling'
  let state = 'idle';
  let hookX = W * 0.5;
  let hookY = waterY - 20;
  let hookVy = 0;
  let hookedFish = null;
  let tension = 30;
  let reelProgress = 0;
  let isHoldingReel = false;
  let biteTimer = 0;

  let fishes = [];
  let bubbles = [];

  function spawnFish() {
    const sp = SPECIES[Math.floor(Math.random() * SPECIES.length)];
    const waterDepth = H - waterY;
    const minY = waterY + sp.zone[0] * waterDepth;
    const maxY = waterY + sp.zone[1] * waterDepth;
    const dir = Math.random() < 0.5 ? 1 : -1;
    fishes.push({
      sp,
      x: dir === 1 ? -60 : W + 60,
      y: minY + Math.random() * Math.max(10, maxY - minY),
      dir,
      phase: Math.random() * Math.PI * 2
    });
  }

  for (let i = 0; i < 16; i++) {
    spawnFish();
    fishes[i].x = Math.random() * W;
  }

  function showToast(html, dur = 2000) {
    toastEl.innerHTML = html;
    toastEl.style.opacity = 1;
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => { toastEl.style.opacity = 0; }, dur);
  }

  function updateUI() {
    document.getElementById('moneyEl').textContent = money;
    document.getElementById('dexCountEl').textContent = caughtSet.size;
  }

  function resetToIdle() {
    state = 'idle';
    hookedFish = null;
    isHoldingReel = false;
    tensionBox.style.display = 'none';
    mainBtn.className = 'action-btn';
    mainBtn.textContent = '🎣 หย่อนเบ็ด';
  }

  // การควบคุมปุ่มหลัก (รองรับทั้งแตะและกดค้าง)
  mainBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handlePressStart();
  });
  mainBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    handlePressEnd();
  });
  mainBtn.addEventListener('mousedown', handlePressStart);
  window.addEventListener('mouseup', handlePressEnd);

  function handlePressStart() {
    if (state === 'idle') {
      state = 'dropping';
      hookX = W * 0.5;
      hookY = waterY + 10;
      hookVy = 3.2;
      mainBtn.className = 'action-btn reel';
      mainBtn.textContent = '🛑 หยุดความลึก / ดึงกลับ';
      playSound(400, 220, 0.2, 'sine');
    } else if (state === 'dropping') {
      state = 'waiting';
      hookVy = 0;
      mainBtn.textContent = '⬆️ ดึงเบ็ดขึ้น';
      playSound(300, 350, 0.1, 'triangle');
    } else if (state === 'waiting') {
      resetToIdle();
      hookY = waterY - 20;
    } else if (state === 'bite') {
      // ตวัดเบ็ดติดปลา!
      state = 'reeling';
      tension = 35;
      reelProgress = 15;
      tensionBox.style.display = 'block';
      mainBtn.className = 'action-btn reel';
      mainBtn.textContent = '🔄 กดค้างเพื่อกรอรอก!';
      isHoldingReel = true;
      playSound(520, 880, 0.2, 'square');
    } else if (state === 'reeling') {
      isHoldingReel = true;
    }
  }

  function handlePressEnd() {
    if (state === 'reeling') {
      isHoldingReel = false;
    }
  }

  function update() {
    // ฟองอากาศใต้น้ำ
    if (Math.random() < 0.18) {
      bubbles.push({ x: Math.random() * W, y: H, r: Math.random() * 3 + 1.5, vy: Math.random() * 1.2 + 0.6 });
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      bubbles[i].y -= bubbles[i].vy;
      if (bubbles[i].y < waterY) bubbles.splice(i, 1);
    }

    // เติมฝูงปลาให้มีในฉากเสมอ
    while (fishes.length < 16) spawnFish();

    // อัปเดตตำแหน่งตะขอเบ็ด
    if (state === 'dropping') {
      hookY += hookVy;
      if (hookY >= H - 24) {
        hookY = H - 24;
        state = 'waiting';
        mainBtn.textContent = '⬆️ ดึงเบ็ดขึ้น';
      }
    }

    // อัปเดตปลาทุกตัว
    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      if (f === hookedFish) continue;
      f.phase += 0.08;
      const surge = f.sp.shape === 'squid' ? (Math.sin(f.phase * 1.5) > 0.3 ? 1.8 : 0.4) : 1;
      f.x += f.dir * f.sp.speed * surge;

      // เช็กปลาเข้ามาฮุบเหยื่อตอนหย่อนเบ็ดหรือรอปลา
      if ((state === 'dropping' || state === 'waiting') && !hookedFish) {
        const dist = Math.hypot(f.x - hookX, f.y - hookY);
        if (dist < f.sp.size + 14) {
          hookedFish = f;
          state = 'bite';
          biteTimer = 75; // มีเวลาตวัดเบ็ด ~1.25 วินาที
          mainBtn.className = 'action-btn bite';
          mainBtn.textContent = '⚡ ปลาฮุบแล้ว! กดตวัดเบ็ด!';
          playSound(660, 990, 0.15, 'square', 0.14);
        }
      }

      if ((f.dir === 1 && f.x > W + 90) || (f.dir === -1 && f.x < -90)) {
        fishes.splice(i, 1);
      }
    }

    // จังหวะปลาฮุบเหยื่อ (นับถอยหลัง)
    if (state === 'bite' && hookedFish) {
      biteTimer--;
      hookedFish.x = hookX + Math.sin(biteTimer * 0.8) * 5;
      hookedFish.y = hookY + 6;
      if (biteTimer <= 0) {
        showToast('💨 ปลาสะบัดหลุดไปแล้ว!');
        fishes = fishes.filter(x => x !== hookedFish);
        resetToIdle();
        hookY = waterY - 20;
      }
    }

    // จังหวะเย่อสู้แรงปลา (Reeling)
    if (state === 'reeling' && hookedFish) {
      const lineStrength = 1 + (lineLv - 1) * 0.28;
      const reelSpeed = 0.55 + (reelLv - 1) * 0.22;
      const fishPull = hookedFish.sp.power / lineStrength;

      if (isHoldingReel) {
        tension += (1.15 * fishPull);
        reelProgress += reelSpeed;
        if (Math.random() < 0.25) playSound(280 + tension * 4, 340 + tension * 4, 0.05, 'triangle', 0.05);
      } else {
        tension -= 1.35;
        reelProgress -= 0.18 * fishPull;
      }

      tension = Math.max(0, tension);
      reelProgress = Math.max(0, reelProgress);

      // อัปเดตตำแหน่งตะขอและปลาตามความคืบหน้า
      const targetY = waterY + (1 - reelProgress / 100) * (H - waterY - 40);
      hookY += (targetY - hookY) * 0.15;
      hookedFish.x = hookX + Math.sin(Date.now() * 0.03) * (8 * fishPull);
      hookedFish.y = hookY + 10;

      tensionBar.style.width = Math.min(100, tension) + '%';
      progBar.style.width = Math.min(100, reelProgress) + '%';

      // สายเอ็นขาด!
      if (tension >= 100) {
        playSound(180, 60, 0.35, 'sawtooth', 0.18);
        showToast('💥 สายเอ็นขาด! ปลาตัวใหญ่แรงเยอะเกินไป<br><small>ลองอัปเกรดสายเอ็นในร้านค้า</small>', 2600);
        fishes = fishes.filter(x => x !== hookedFish);
        resetToIdle();
        hookY = waterY - 20;
        return;
      }

      // ตกปลาสำเร็จ!
      if (reelProgress >= 100) {
        const sp = hookedFish.sp;
        const isNew = !caughtSet.has(sp.id);
        caughtSet.add(sp.id);
        money += sp.price;
        updateUI();
        playSound(523, 1046, 0.3, 'sine', 0.16);
        showToast(
          `${isNew ? '✨ ค้นพบสายพันธุ์ใหม่!<br>' : '🎉 ตกได้สำเร็จ!<br>'}` +
          `<span style="color:${sp.rColor};font-size:18px;">${sp.name}</span><br>` +
          `💰 +${sp.price} บาท`,
          2600
        );
        fishes = fishes.filter(x => x !== hookedFish);
        resetToIdle();
        hookY = waterY - 20;
      }
    }
  }

  function drawFish(f) {
    const { sp, x, y, dir, phase } = f;
    const s = sp.size;
    ctx.save();
    ctx.translate(x, y);
    if (dir === -1) ctx.scale(-1, 1);

    const tailWag = Math.sin(phase * 2) * (s * 0.18);

    if (sp.shape === 'chest') {
      // หีบสมบัติ
      ctx.fillStyle = sp.c1;
      ctx.fillRect(-s * 0.6, -s * 0.45, s * 1.2, s * 0.9);
      ctx.strokeStyle = sp.c2;
      ctx.lineWidth = 3;
      ctx.strokeRect(-s * 0.6, -s * 0.45, s * 1.2, s * 0.9);
      ctx.fillStyle = sp.c2;
      ctx.fillRect(-4, -4, 8, 8);
    } else if (sp.shape === 'crab') {
      // ปูเสฉวน
      ctx.fillStyle = sp.c1;
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.65, s * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-s * 0.6, -s * 0.35, s * 0.25, 0, Math.PI * 2);
      ctx.arc(s * 0.6, -s * 0.35, s * 0.25, 0, Math.PI * 2);
      ctx.fill();
    } else if (sp.shape === 'squid' || sp.shape === 'kraken') {
      // ปลาหมึก / คราเคน
      ctx.fillStyle = sp.c1;
      ctx.beginPath();
      ctx.moveTo(s * 0.8, 0);
      ctx.lineTo(-s * 0.2, -s * 0.45);
      ctx.lineTo(-s * 0.2, s * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = sp.c2;
      ctx.lineWidth = sp.shape === 'kraken' ? 4 : 2;
      for (let t = -2; t <= 2; t++) {
        ctx.beginPath();
        ctx.moveTo(-s * 0.2, t * (s * 0.14));
        ctx.lineTo(-s * 0.85, t * (s * 0.18) + tailWag);
        ctx.stroke();
      }
    } else if (sp.shape === 'ray') {
      // ปลากระเบน
      ctx.fillStyle = sp.c1;
      ctx.beginPath();
      ctx.moveTo(s * 0.7, 0);
      ctx.lineTo(0, -s * 0.75);
      ctx.lineTo(-s * 0.5, 0);
      ctx.lineTo(0, s * 0.75);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = sp.c2;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-s * 0.5, 0);
      ctx.lineTo(-s * 1.2, tailWag);
      ctx.stroke();
    } else if (sp.shape === 'eel') {
      // ปลาไหลไฟฟ้า
      ctx.strokeStyle = sp.c1;
      ctx.lineWidth = s * 0.28;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s * 0.8, 0);
      ctx.quadraticCurveTo(0, tailWag * 1.5, -s * 0.9, -tailWag);
      ctx.stroke();
    } else if (sp.shape === 'turtle') {
      // เต่าทะเล
      ctx.fillStyle = sp.c2;
      ctx.beginPath();
      ctx.ellipse(s * 0.2, -s * 0.35, s * 0.22, s * 0.45, 0.4, 0, Math.PI * 2);
      ctx.ellipse(s * 0.2, s * 0.35, s * 0.22, s * 0.45, -0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = sp.c1;
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.65, s * 0.48, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = sp.c2;
      ctx.beginPath();
      ctx.arc(s * 0.75, 0, s * 0.2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // ปลาทั่วไป, ปลาการ์ตูน, ปักเป้า, กระโทงแทง, ฉลาม, วาฬเพชฌฆาต
      const bodyH = sp.shape === 'puffer' ? s * 0.65 : s * 0.42;
      ctx.fillStyle = sp.c1;
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.75, bodyH, 0, 0, Math.PI * 2);
      ctx.fill();

      // หางปลา
      ctx.beginPath();
      ctx.moveTo(-s * 0.65, 0);
      ctx.lineTo(-s * 1.15, -bodyH * 0.8 + tailWag);
      ctx.lineTo(-s * 1.15, bodyH * 0.8 + tailWag);
      ctx.closePath();
      ctx.fill();

      // ลวดลายพิเศษตามชนิด
      if (sp.shape === 'clown' || sp.shape === 'orca') {
        ctx.fillStyle = sp.c2;
        ctx.fillRect(-s * 0.15, -bodyH * 0.85, s * 0.22, bodyH * 1.7);
      }
      if (sp.shape === 'marlin') {
        ctx.strokeStyle = sp.c2;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(s * 0.7, 0);
        ctx.lineTo(s * 1.35, 0);
        ctx.stroke();
      }
      if (sp.shape === 'shark' || sp.shape === 'orca' || sp.shape === 'marlin') {
        ctx.fillStyle = sp.c1;
        ctx.beginPath();
        ctx.moveTo(0, -bodyH * 0.8);
        ctx.lineTo(-s * 0.25, -bodyH * 1.45);
        ctx.lineTo(-s * 0.35, -bodyH * 0.75);
        ctx.closePath();
        ctx.fill();
      }
    }

    // ดวงตาปลา
    if (sp.shape !== 'chest') {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s * 0.42, -s * 0.12, Math.max(2, s * 0.09), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(s * 0.44, -s * 0.12, Math.max(1, s * 0.045), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function draw() {
    // 1. ท้องฟ้าด้านบน
    const skyGrad = ctx.createLinearGradient(0, 0, 0, waterY);
    skyGrad.addColorStop(0, '#0ea5e9');
    skyGrad.addColorStop(1, '#bae6fd');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, waterY);

    // ดวงอาทิตย์
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(W * 0.82, waterY * 0.35, 22, 0, Math.PI * 2);
    ctx.fill();

    // 2. ผืนน้ำไล่ระดับความลึก (ตื้น -> กลาง -> ลึก -> ก้นสมุทร)
    const seaGrad = ctx.createLinearGradient(0, waterY, 0, H);
    seaGrad.addColorStop(0, '#0284c7');
    seaGrad.addColorStop(0.35, '#0369a1');
    seaGrad.addColorStop(0.7, '#0c4a6e');
    seaGrad.addColorStop(1, '#041322');
    ctx.fillStyle = seaGrad;
    ctx.fillRect(0, waterY, W, H - waterY);

    // พื้นทรายก้นบ่อ
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, H - 18, W, 18);

    // ฟองอากาศ
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    bubbles.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // 3. เรือตกปลาและชาวประมงบนผิวน้ำ
    const boatX = W * 0.5;
    ctx.fillStyle = '#9a3412';
    ctx.beginPath();
    ctx.moveTo(boatX - 45, waterY - 8);
    ctx.lineTo(boatX + 45, waterY - 8);
    ctx.lineTo(boatX + 32, waterY + 8);
    ctx.lineTo(boatX - 32, waterY + 8);
    ctx.closePath();
    ctx.fill();

    // ตัวนักตกปลา & คันเบ็ด
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(boatX - 8, waterY - 24, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(boatX - 14, waterY - 17, 12, 10);

    const rodTipX = boatX + 18;
    const rodTipY = waterY - 34;
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(boatX - 4, waterY - 14);
    ctx.lineTo(rodTipX, rodTipY);
    ctx.stroke();

    // 4. สายเบ็ดและตะขอ
    ctx.strokeStyle = state === 'reeling' && tension > 75 ? '#ef4444' : 'rgba(255, 255, 255, 0.85)';
    ctx.lineWidth = 1.5 + (lineLv - 1) * 0.4;
    ctx.beginPath();
    ctx.moveTo(rodTipX, rodTipY);
    ctx.lineTo(hookX, hookY);
    ctx.stroke();

    // ตัวตะขอเบ็ด
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(hookX - 3, hookY, 4, 0, Math.PI);
    ctx.stroke();

    // 5. วาดฝูงปลาทั้งหมด
    fishes.forEach(drawFish);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();

  // ระบบหน้าต่างสมุดสะสมปลา (16 ชนิด)
  function openDex() {
    const grid = document.getElementById('dexGrid');
    grid.innerHTML = '';
    SPECIES.forEach(sp => {
      const unlocked = caughtSet.has(sp.id);
      const card = document.createElement('div');
      card.className = 'dex-card' + (unlocked ? '' : ' locked');
      card.innerHTML = `
        <span class="rarity" style="background:${sp.rColor};color:#041322;">${sp.rarity}</span>
        <strong>${unlocked ? sp.name : '??? (ยังไม่เคยตกได้)'}</strong>
        <span>ราคา: ${unlocked ? sp.price + ' บ.' : '???'}</span>
      `;
      grid.appendChild(card);
    });
    document.getElementById('dexModal').style.display = 'flex';
  }

  // ระบบร้านอัปเกรดอุปกรณ์
  function openShop() {
    const list = document.getElementById('shopList');
    const lineCost = lineLv * 80;
    const reelCost = reelLv * 90;
    list.innerHTML = `
      <div class="shop-item">
        <div>
          <strong>🧵 สายเอ็นเหนียวพิเศษ (Lv.${lineLv})</strong><br>
          <small style="color:#93c5fd;">ลดโอกาสสายขาดเวลาเย่อปลาใหญ่</small>
        </div>
        <button class="buy-btn" onclick="buyUpgrade('line', ${lineCost})">${lineCost} บ.</button>
      </div>
      <div class="shop-item">
        <div>
          <strong>⚙️ รอกทดรอบความเร็วสูง (Lv.${reelLv})</strong><br>
          <small style="color:#93c5fd;">ดึงปลาขึ้นจากน้ำได้เร็วขึ้น</small>
        </div>
        <button class="buy-btn" onclick="buyUpgrade('reel', ${reelCost})">${reelCost} บ.</button>
      </div>
    `;
    document.getElementById('shopModal').style.display = 'flex';
  }

  function buyUpgrade(type, cost) {
    if (money < cost) {
      showToast('❌ เงินยังไม่พอครับ!', 1400);
      return;
    }
    money -= cost;
    if (type === 'line') lineLv++;
    if (type === 'reel') reelLv++;
    updateUI();
    playSound(600, 1200, 0.2, 'sine');
    openShop();
  }

  function closeModals() {
    document.getElementById('dexModal').style.display = 'none';
    document.getElementById('shopModal').style.display = 'none';
  }
</script>
</body>
