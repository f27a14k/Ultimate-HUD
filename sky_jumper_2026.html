<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sky Jumper 2026 - เกมกระโดดไต่หอคอย</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: #0d1321;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  #game-container {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 760px;
    background: linear-gradient(to bottom, #1d2d44, #0d1321);
    box-shadow: 0 0 25px rgba(0,0,0,0.8);
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ui-top {
    position: absolute;
    top: 14px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    pointer-events: none;
    z-index: 5;
  }
  #controls {
    position: absolute;
    bottom: 18px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    z-index: 10;
  }
  .btn {
    flex: 1;
    height: 68px;
    background: rgba(255, 255, 255, 0.14);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 18px;
    color: #fff;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .btn:active {
    background: rgba(255, 255, 255, 0.32);
    transform: scale(0.96);
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(13, 19, 33, 0.86);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    z-index: 20;
  }
  #overlay h1 { font-size: 28px; color: #ffd166; margin-bottom: 10px; }
  #overlay p { font-size: 15px; color: #cbd5e1; margin-bottom: 22px; line-height: 1.5; }
  #start-btn {
    padding: 14px 36px;
    font-size: 18px;
    font-weight: bold;
    color: #0d1321;
    background: linear-gradient(135deg, #ffd166, #f77f00);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(247, 127, 0, 0.4);
  }
</style>
</head>
<body>
<div id="game-container">
  <div id="ui-top">
    <div>คะแนน: <span id="score">0</span></div>
    <div>สูงสุด: <span id="high-score">0</span></div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="controls">
    <div class="btn" id="btn-left">◀</div>
    <div class="btn" id="btn-right">▶</div>
  </div>
  <div id="overlay">
    <h1>🚀 Sky Jumper 2026</h1>
    <p>กระโดดไต่ชั้นขึ้นไปให้สูงที่สุด!<br>เดินทะลุขอบซ้ายไปโผล่ขวาได้เหมือนแพ็คแมน<br>เหยียบสปริงสีทองเพื่อดีดตัวพุ่งสูง</p>
    <button id="start-btn">เริ่มเล่นเกม</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('high-score');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');

let width, height;
function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  width = canvas.width = rect.width;
  height = canvas.height = rect.height;
}
window.addEventListener('resize', resize);
resize();

// ระบบเสียงสังเคราะห์ Web Audio API
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function playTone(freqStart, freqEnd, duration, type = 'sine', vol = 0.12) {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

let player, platforms, stars, score, highScore = 0, gameRunning = false;
let keys = { left: false, right: false };

function initGame() {
  score = 0;
  scoreEl.textContent = '0';
  player = {
    x: width / 2 - 16,
    y: height - 150,
    w: 32,
    h: 36,
    vx: 0,
    vy: -11,
    facing: 1
  };
  platforms = [];
  stars = [];
  // แท่นฐานเริ่มต้น
  platforms.push({ x: width / 2 - 45, y: height - 90, w: 90, h: 14, type: 'normal', dir: 1, spring: false });
  for (let i = 1; i < 12; i++) {
    spawnPlatform(height - 90 - i * 68);
  }
}

function spawnPlatform(y) {
  const w = 74;
  const x = Math.random() * (width - w);
  const rand = Math.random();
  let type = 'normal';
  if (score > 300 && rand < 0.25) type = 'moving';
  else if (score > 600 && rand < 0.42) type = 'fragile';
  const spring = (type === 'normal' && Math.random() < 0.16);
  platforms.push({ x, y, w, h: 14, type, dir: Math.random() < 0.5 ? 1 : -1, spring, broken: false });

  if (Math.random() < 0.28) {
    stars.push({ x: x + w / 2, y: y - 22, r: 9, collected: false });
  }
}

function update() {
  if (!gameRunning) return;

  // การควบคุมซ้าย-ขวา
  const speed = 5.4;
  if (keys.left) { player.vx = -speed; player.facing = -1; }
  else if (keys.right) { player.vx = speed; player.facing = 1; }
  else { player.vx *= 0.82; }

  player.x += player.vx;

  // ทะลุขอบจอซ้าย-ขวาเหมือนแพ็คแมน (Screen Wrapping)
  if (player.x + player.w < 0) player.x = width;
  else if (player.x > width) player.x = -player.w;

  // แรงโน้มถ่วง
  player.vy += 0.38;
  player.y += player.vy;

  // เลื่อนกล้องขึ้นเมื่อตัวละครสูงเกินครึ่งจอ
  if (player.y < height * 0.42 && player.vy < 0) {
    const dy = -player.vy;
    player.y += dy;
    score += Math.floor(dy * 0.5);
    scoreEl.textContent = score;
    if (score > highScore) {
      highScore = score;
      highScoreEl.textContent = highScore;
    }
    platforms.forEach(p => p.y += dy);
    stars.forEach(s => s.y += dy);
  }

  // อัปเดตแท่นและเช็กการเหยียบกระโดด
  platforms.forEach(p => {
    if (p.type === 'moving') {
      p.x += p.dir * 2.1;
      if (p.x <= 0 || p.x + p.w >= width) p.dir *= -1;
    }
    if (!p.broken && player.vy > 0 &&
        player.x + player.w * 0.75 > p.x &&
        player.x + player.w * 0.25 < p.x + p.w &&
        player.y + player.h >= p.y &&
        player.y + player.h <= p.y + p.h + player.vy + 4) {
      if (p.type === 'fragile') {
        p.broken = true;
        playTone(180, 70, 0.14, 'sawtooth');
      } else if (p.spring) {
        player.vy = -18.5;
        playTone(320, 880, 0.22, 'square');
      } else {
        player.vy = -11.5;
        playTone(260, 520, 0.11, 'sine');
      }
    }
  });

  // เก็บดาวโบนัส
  stars.forEach(s => {
    if (!s.collected) {
      const dx = (player.x + player.w / 2) - s.x;
      const dy = (player.y + player.h / 2) - s.y;
      if (Math.hypot(dx, dy) < 28) {
        s.collected = true;
        score += 100;
        scoreEl.textContent = score;
        if (score > highScore) { highScore = score; highScoreEl.textContent = highScore; }
        playTone(780, 1320, 0.15, 'triangle');
      }
    }
  });

  // ลบแท่นที่ตกขอบล่างและสร้างแท่นใหม่ด้านบน
  platforms = platforms.filter(p => p.y < height + 30);
  stars = stars.filter(s => s.y < height + 30 && !s.collected);
  while (platforms.length < 12) {
    const highestY = Math.min(...platforms.map(p => p.y));
    spawnPlatform(highestY - (62 + Math.random() * 18));
  }

  // เช็กตกเหว (Game Over)
  if (player.y > height + 40) {
    gameRunning = false;
    playTone(240, 65, 0.35, 'sawtooth');
    overlay.style.display = 'flex';
    overlay.querySelector('h1').textContent = '💥 จบเกม!';
    overlay.querySelector('p').innerHTML = `คะแนนของคุณ: <strong style="color:#ffd166;font-size:20px">${score}</strong><br>สถิติสูงสุด: ${highScore}`;
    startBtn.textContent = 'เล่นอีกครั้ง';
  }
}

function draw() {
  ctx.clearRect(0, 0, width, height);

  // วาดแท่นกระโดด
  platforms.forEach(p => {
    if (p.broken) return;
    if (p.type === 'normal') ctx.fillStyle = '#06d6a0';
    else if (p.type === 'moving') ctx.fillStyle = '#38bdf8';
    else if (p.type === 'fragile') ctx.fillStyle = '#f43f5e';
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.w, p.h, 7);
    ctx.fill();

    if (p.spring) {
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(p.x + p.w / 2 - 10, p.y - 6, 20, 6);
    }
  });

  // วาดดาวโบนัส
  stars.forEach(s => {
    if (s.collected) return;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // วาดตัวละครนักผจญภัย
  if (player) {
    // ลำตัว
    ctx.fillStyle = '#ef476f';
    ctx.beginPath();
    ctx.roundRect(player.x + 4, player.y + 14, player.w - 8, player.h - 16, 6);
    ctx.fill();
    // หัว
    ctx.fillStyle = '#ffe5d9';
    ctx.beginPath();
    ctx.arc(player.x + player.w / 2, player.y + 10, 10, 0, Math.PI * 2);
    ctx.fill();
    // หมวก
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(player.x + 6, player.y, player.w - 12, 5);
    // ดวงตา
    ctx.fillStyle = '#0d1321';
    const eyeX = player.facing === 1 ? player.x + player.w / 2 + 4 : player.x + player.w / 2 - 4;
    ctx.beginPath();
    ctx.arc(eyeX, player.y + 9, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ควบคุมด้วยปุ่มสัมผัสบนหน้าจอและคีย์บอร์ด
const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
btnLeft.addEventListener('touchstart', e => { e.preventDefault(); keys.left = true; });
btnLeft.addEventListener('touchend', e => { e.preventDefault(); keys.left = false; });
btnLeft.addEventListener('mousedown', () => keys.left = true);
btnLeft.addEventListener('mouseup', () => keys.left = false);

btnRight.addEventListener('touchstart', e => { e.preventDefault(); keys.right = true; });
btnRight.addEventListener('touchend', e => { e.preventDefault(); keys.right = false; });
btnRight.addEventListener('mousedown', () => keys.right = true);
btnRight.addEventListener('mouseup', () => keys.right = false);

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

startBtn.addEventListener('click', () => {
  initGame();
  overlay.style.display = 'none';
  gameRunning = true;
});

initGame();
loop();
</script>
</body>
</html>
