<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรไฟล์ปริศนา - ระบบสร้างโลกอัตโนมัติ</title>
<style>
  :root {
    --bg: #f8f9fa;
    --text: #212529;
    --accent: #0d6efd;
    --card-bg: #ffffff;
    --border: #dee2e6;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    transition: background-color 0.8s ease, color 0.8s ease;
  }
  .container {
    max-width: 680px;
    width: 100%;
    background: var(--card-bg);
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    border: 1px solid var(--border);
    transition: all 0.8s ease;
  }
  h1 {
    margin-top: 0;
    font-size: 1.6rem;
    border-bottom: 2px solid var(--border);
    padding-bottom: 12px;
  }
  p {
    line-height: 1.9;
    font-size: 1.05rem;
  }
  .word-node {
    cursor: pointer;
    border-radius: 4px;
    padding: 0 2px;
    transition: background-color 0.2s, color 0.2s;
  }
  .word-node.selected {
    background-color: var(--accent);
    color: #fff;
    font-weight: bold;
  }
  .status-bar {
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px dashed var(--border);
    font-size: 0.85rem;
    opacity: 0.75;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    margin-top: 15px;
    transition: opacity 0.2s;
  }
  .btn:hover {
    opacity: 0.85;
  }
  .canvas-box {
    margin: 20px 0;
    text-align: center;
  }
  canvas {
    border-radius: 8px;
    border: 1px solid var(--border);
    max-width: 100%;
  }
  .tag {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.8rem;
    margin-right: 6px;
    background: rgba(128,128,128,0.15);
  }
</style>
</head>
<body>

<div class="container" id="app">
  <!-- เนื้อหาจะถูกสร้างและเปลี่ยนแปลงโดยอัตโนมัติที่นี่ -->
</div>

<script>
// คลังคำศัพท์และคุณสมบัติสำหรับการคำนวณ (ไม่ใช่ด่านสำเร็จรูป)
const lexicon = [
  { word: "ความทรงจำ", trait: "past", power: 14, hue: 210 },
  { word: "เข็มทิศ", trait: "guide", power: 27, hue: 45 },
  { word: "เงามืด", trait: "shadow", power: 39, hue: 270 },
  { word: "รหัสผ่าน", trait: "logic", power: 52, hue: 140 },
  { word: "เวลา", trait: "flow", power: 68, hue: 190 },
  { word: "จักรวาล", trait: "void", power: 83, hue: 320 },
  { word: "เครื่องจักร", trait: "tech", power: 91, hue: 110 },
  { word: "ความฝัน", trait: "illusion", power: 44, hue: 290 },
  { word: "กุญแจ", trait: "access", power: 77, hue: 30 }
];

// โครงสร้างประโยคแม่แบบสำหรับให้โปรแกรมประกอบเรื่องราวเอง
const templates = [
  "สวัสดีครับ ยินดีต้อนรับสู่บันทึกส่วนตัวของผม ในโลกที่เต็มไปด้วยข้อมูลข่าวสาร หลายคนมักหลงลืม {0} ที่เคยผ่านมา ผมเชื่อว่าทุกสิ่งล้วนมี {1} ซ่อนอยู่เบื้องหลังเสมอ หากคุณลองสังเกตให้ดี คุณอาจจะพบ {2} ที่เปลี่ยนมุมมองของคุณไปตลอดกาล",
  "ชั้นที่ {LEVEL} : ระบบตรวจพบคลื่นความถี่จากจิตใต้สำนึก ดูเหมือนว่า {0} กำลังทำปฏิกิริยากับ {1} อย่างรุนแรง โครงสร้างของมิติกำลังบิดเบี้ยวเพื่อเปิดทางไปสู่ {2} ที่ไม่เคยมีใครเข้าถึงมาก่อน",
  "บันทึกการเดินทางรอบที่ {LEVEL} : ไม่มีแผนที่ใดบอกเส้นทางนี้ได้นอกจาก {0} ที่คุณเลือกหยิบขึ้นมา ท่ามกลางความเงียบงัน {1} ได้เริ่มทำงานและสร้างภาพสะท้อนของ {2} ขึ้นตรงหน้าคุณ"
];

let level = 0;
let selectedWords = [];
let worldSeed = 0;

// ฟังก์ชันเริ่มต้นหน้าแรก (หน้าโปรไฟล์ปกติ)
function initProfile() {
  level = 0;
  selectedWords = [];
  worldSeed = 0;
  setTheme("#f8f9fa", "#212529", "#0d6efd", "#ffffff", "#dee2e6");
  
  const initialWords = [lexicon[0], lexicon[1], lexicon[2], lexicon[3], lexicon[4]];
  renderStage(
    "พื้นที่ส่วนตัว & บันทึกความคิด",
    "ผมเป็นนักพัฒนาที่ชอบตั้งคำถามกับสิ่งรอบตัว บางครั้งคำตอบที่เราตามหาไม่ได้อยู่ในตำรา แต่ซ่อนอยู่ใน {0} หรืออาจต้องใช้ {1} เพื่อนำทาง ในวันที่ทุกอย่างดูเหมือน {2} ลองใช้ {3} วิเคราะห์ดู แล้วคุณจะเข้าใจคุณค่าของ {4} มากขึ้นครับ",
    initialWords,
    false
  );
}

// ฟังก์ชันเปลี่ยนสีธีมทั้งหน้าเว็บแบบ Dynamic
function setTheme(bg, text, accent, cardBg, border) {
  const root = document.documentElement;
  root.style.setProperty('--bg', bg);
  root.style.setProperty('--text', text);
  root.style.setProperty('--accent', accent);
  root.style.setProperty('--card-bg', cardBg);
  root.style.setProperty('--border', border);
}

// ฟังก์ชันสร้างหน้าเว็บสดๆ จากสมการและคำที่เลือก
function renderStage(title, templateText, wordPool, isGeneratedWorld) {
  const app = document.getElementById("app");
  
  // แทนที่ตัวแปร {0}, {1}, ... ด้วยคำที่คลิกได้
  let processedText = templateText.replace("{LEVEL}", level);
  wordPool.forEach((item, index) => {
    const spanHtml = `<span class="word-node" data-idx="${index}" onclick="toggleWord(${index})">${item.word}</span>`;
    processedText = processedText.replace(`{${index}}`, spanHtml);
  });

  // เก็บ pool ปัจจุบันไว้ให้ฟังก์ชันคลิกเรียกใช้
  window.currentPool = wordPool;

  let canvasHtml = "";
  if (isGeneratedWorld) {
    canvasHtml = `
      <div class="canvas-box">
        <canvas id="worldCanvas" width="580" height="180"></canvas>
      </div>
    `;
  }

  let tagsHtml = "";
  if (isGeneratedWorld && window.lastCombo) {
    tagsHtml = `<div style="margin-bottom:12px;">` + 
      window.lastCombo.map(w => `<span class="tag">#${w.word} (${w.trait})</span>`).join("") +
      `</div>`;
  }

  app.innerHTML = `
    <h1>${title}</h1>
    ${tagsHtml}
    ${canvasHtml}
    <p>${processedText}</p>
    <div class="status-bar">
      <span id="clue-status">${level === 0 ? "สถานะ: โหมดปกติ (ลองสังเกตคำในข้อความ)" : "มิติที่: " + level + " | ค่าพลังงานโลก: " + worldSeed}</span>
      <span>เลือกแล้ว: <strong id="count">0</strong> / 3 คำ</span>
    </div>
    ${level > 0 ? `<button class="btn" onclick="initProfile()">รีเซ็ตกลับสู่จุดเริ่มต้น</button>` : ""}
  `;

  if (isGeneratedWorld) {
    drawProceduralArt(worldSeed, window.lastCombo);
  }
}

// ฟังก์ชันจัดการเมื่อผู้ใช้แตะคำศัพท์
function toggleWord(poolIndex) {
  const wordObj = window.currentPool[poolIndex];
  const node = document.querySelector(`.word-node[data-idx="${poolIndex}"]`);
  
  const existingPos = selectedWords.findIndex(w => w.word === wordObj.word);
  
  if (existingPos > -1) {
    selectedWords.splice(existingPos, 1);
    node.classList.remove("selected");
  } else {
    selectedWords.push(wordObj);
    node.classList.add("selected");
  }

  document.getElementById("count").innerText = selectedWords.length;

  // เมื่อแตะครบ 3 คำ โปรแกรมจะคำนวณและสร้างหน้าใหม่ทันที
  if (selectedWords.length === 3) {
    setTimeout(() => {
      generateNextWorld();
    }, 350);
  }
}

// สมองกลคำนวณและสร้างโลกใบใหม่เอง (Procedural Generation)
function generateNextWorld() {
  level++;
  window.lastCombo = [...selectedWords];
  
  // คำนวณ Seed และสีประจำมิติจากค่าพลังของคำ 3 คำที่เลือก
  const powerSum = selectedWords.reduce((sum, item) => sum + item.power, 0);
  const avgHue = Math.floor(selectedWords.reduce((sum, item) => sum + item.hue, 0) / 3);
  worldSeed = (worldSeed + powerSum * level) % 9999;

  // สร้างโทนสีใหม่ที่ไม่ซ้ำเดิมจากค่าที่คำนวณได้
  const isDark = (powerSum % 2 === 0);
  const bg = isDark ? `hsl(${avgHue}, 25%, 10%)` : `hsl(${avgHue}, 35%, 94%)`;
  const text = isDark ? `hsl(${avgHue}, 80%, 85%)` : `hsl(${avgHue}, 40%, 15%)`;
  const accent = `hsl(${(avgHue + 140) % 360}, 75%, 50%)`;
  const cardBg = isDark ? `hsl(${avgHue}, 25%, 15%)` : `#ffffff`;
  const border = `hsl(${avgHue}, 30%, 40%)`;

  setTheme(bg, text, accent, cardBg, border);

  // สุ่มเลือกคำศัพท์ชุดใหม่ 3-5 คำจากคลังเพื่อสร้างเรื่องราวถัดไป
  const shuffled = [...lexicon].sort(() => 0.5 - Math.random());
  const nextPool = shuffled.slice(0, 4);

  // เลือกแม่แบบประโยคและปรับแต่ง
  const tplIndex = (powerSum + level) % templates.length;
  let chosenTemplate = templates[tplIndex] + " นอกจากนี้คุณยังสัมผัสได้ถึง {3} ที่ซ่อนอยู่ในเงา";

  // สร้างชื่อมิติอัตโนมัติ
  const dimensionNames = ["มิติคู่ขนาน", "โครงข่ายจิตสำนึก", "ห้องทดลองเวลา", "จักรวาลจำลอง", "รอยแยกความทรงจำ"];
  const title = `[ ${dimensionNames[worldSeed % dimensionNames.length]} #${worldSeed} ]`;

  selectedWords = [];
  renderStage(title, chosenTemplate, nextPool, true);
}

// วาดกราฟิกเรขาคณิต/คลื่นพลังงานสดๆ ตามค่าคำนวณ (ไม่มีไฟล์รูปภาพล่วงหน้า)
function drawProceduralArt(seed, combo) {
  const canvas = document.getElementById("worldCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // พื้นหลัง Canvas
  ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // วาดลวดลายตามค่าพลังของคำทั้ง 3 คำ
  combo.forEach((item, i) => {
    ctx.beginPath();
    ctx.strokeStyle = `hsl(${item.hue}, 80%, 60%)`;
    ctx.lineWidth = 2;
    
    for (let x = 0; x < canvas.width; x += 5) {
      const freq = (item.power / 1000) * (i + 1);
      const amp = 25 + (seed % 30);
      const y = (canvas.height / 2) + Math.sin(x * freq + seed + i) * amp * Math.cos(x * 0.01);
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  });

  // วาดจุดศูนย์กลางพลังงาน
  const nodes = (seed % 7) + 3;
  for (let n = 0; n < nodes; n++) {
    const nx = ((seed * (n + 1) * 37) % (canvas.width - 60)) + 30;
    const ny = ((seed * (n + 2) * 53) % (canvas.height - 40)) + 20;
    ctx.beginPath();
    ctx.arc(nx, ny, (n % 4) + 3, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${(combo[n % 3].hue + 60) % 360}, 90%, 70%)`;
    ctx.fill();
  }
}

// เริ่มทำงาน
initProfile();
</script>
</body>
</html>
